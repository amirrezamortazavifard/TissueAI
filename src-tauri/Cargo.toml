[package]
name = "tissueai"
version = "0.1.0"
description = "TissueAI - AI-Powered Tissue Analysis"
authors = ["you"]
edition = "2021"

[lib]
name = "tissueai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.17"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "gif"] }

base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
bytes = "1"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
block-padding = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "rustls-tls"], default-features = false }
hostname = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "autodiff", "train"] }
dirs-next = "2"
dirs = "5"
csv = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
zip = "0.6"
tar = "0.4"
flate2 = "1"
sysinfo = "0.32"
local-ip-address = "0.6"
regex = "1"
once_cell = "1"
url = "2"
libc = "0.2"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }

keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
aes-gcm = "0.10"
sha2 = "0.10"
arboard = "3"

[dev-dependencies]
tempfile = "3"
