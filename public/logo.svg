<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Glass Gradient -->
    <linearGradient id="t-glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1535" />
      <stop offset="40%" stop-color="#12182c" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Specular Edge Gradient -->
    <linearGradient id="t-glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)" />
      <stop offset="50%" stop-color="rgba(236, 72, 153, 0.5)" />
      <stop offset="100%" stop-color="rgba(91, 168, 245, 0.6)" />
    </linearGradient>

    <!-- Brain Lobe / Tissue Cell Gradient Primary -->
    <linearGradient id="t-brain-primary" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#5BA8F5" />
    </linearGradient>

    <!-- Brain Lobe Secondary / Cyan Glow -->
    <linearGradient id="t-brain-secondary" x1="90%" y1="10%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Specular Top Light -->
    <linearGradient id="t-top-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Surface -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="#070a10" />
  
  <!-- Frosted Glass Badge Frame -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="24"
    fill="url(#t-glass-bg)"
    stroke="url(#t-glass-border)"
    stroke-width="2"
  />

  <!-- Glass Top Highlight Line -->
  <path
    d="M 16 6 L 84 6 C 90 6 94 10 94 16 C 94 12 90 8 84 8 L 16 8 C 10 8 6 12 6 16 C 6 10 10 6 16 6 Z"
    fill="url(#t-top-shine)"
  />

  <!-- DIGITAL BRAIN & TISSUE MATRIX GRAPHIC -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Left Brain Hemisphere / Tissue Slice Contour -->
    <path
      d="M 48 18 C 34 18, 22 26, 22 42 C 22 52, 28 60, 36 66 C 40 69, 45 74, 48 80 C 51 74, 56 69, 60 66 C 68 60, 74 52, 74 42 C 74 26, 62 18, 48 18 Z"
      fill="url(#t-brain-primary)"
      fill-opacity="0.3"
      stroke="url(#t-brain-primary)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Brain Sulci & Tissue Cell Boundaries -->
    <path
      d="M 48 24 C 40 24 32 30 32 40 C 32 48 38 52 48 56"
      stroke="#ec4899"
      stroke-width="2.2"
      stroke-dasharray="3 3"
      fill="none"
      opacity="0.9"
    />
    <path
      d="M 48 24 C 56 24 64 30 64 40 C 64 48 58 52 48 56"
      stroke="#5BA8F5"
      stroke-width="2.2"
      stroke-dasharray="3 3"
      fill="none"
      opacity="0.9"
    />

    <!-- Center Neural Stem / Microscopic Core -->
    <path
      d="M 48 56 L 48 76"
      stroke="url(#t-brain-secondary)"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Neural Network Nodes & Cell Nuclei -->
    <circle cx="48" cy="22" r="4.5" fill="#ffffff" />
    <circle cx="28" cy="34" r="4" fill="#f472b6" />
    <circle cx="24" cy="48" r="3.5" fill="#c084fc" />
    <circle cx="34" cy="62" r="4" fill="#a855f7" />
    <circle cx="68" cy="34" r="4" fill="#38bdf8" />
    <circle cx="72" cy="48" r="3.5" fill="#60a5fa" />
    <circle cx="62" cy="62" r="4" fill="#818cf8" />

    <!-- Center Core Node -->
    <circle cx="48" cy="42" r="6" fill="#ffffff" />

    <!-- Synaptic Connection Rays / Microscopic Strands -->
    <line x1="48" y1="42" x2="28" y2="34" stroke="rgba(255,255,255,0.8)" stroke-width="1.8" />
    <line x1="48" y1="42" x2="68" y2="34" stroke="rgba(255,255,255,0.8)" stroke-width="1.8" />
    <line x1="48" y1="42" x2="24" y2="48" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" />
    <line x1="48" y1="42" x2="72" y2="48" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" />
    <line x1="48" y1="42" x2="34" y2="62" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" />
    <line x1="48" y1="42" x2="62" y2="62" stroke="rgba(255,255,255,0.7)" strokeWidth="1.8" />

    <!-- Floating Micro-Particles (Cellular Fragments) -->
    <circle cx="38" cy="28" r="1.8" fill="#ffffff" opacity="0.9" />
    <circle cx="58" cy="28" r="1.8" fill="#ffffff" opacity="0.9" opacity="0.9" />
    <circle cx="48" cy="68" r="2.2" fill="#38bdf8" opacity="0.9" />
  </g>
</svg>
